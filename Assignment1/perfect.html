<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Number Checker</title>
</head>
<body>

    <h2>Perfect Number Checker</h2>
    
    <label for="num">Enter a number: </label>
    <input type="number" id="num" min="1">
    <button onclick="checkPerfect()">Check</button>

    <p id="result"></p>

    <script>
        function checkPerfect() {
            let n = parseInt(document.getElementById("num").value);
            let resultElement = document.getElementById("result");

            if (isNaN(n) || n <= 0) {
                resultElement.innerHTML = "Please enter a valid positive integer.";
                return;
            }

            let sum = 0;
            // Calculate sum of proper divisors
            for (let i = 1; i <= n / 2; i++) {
                if (n % i === 0) {
                    sum += i;
                }
            }

            if (sum === n) {
                resultElement.innerHTML = `<strong>${n}</strong> is a Perfect Number.`;
            } else {
                let nearest = 0;
                // Find nearest perfect number strictly less than n
                for (let num = n - 1; num >= 1; num--) {
                    let divisorSum = 0;
                    for (let i = 1; i <= num / 2; i++) {
                        if (num % i === 0) {
                            divisorSum += i;
                        }
                    }
                    if (divisorSum === num && num > 0) {
                        nearest = num;
                        break;
                    }
                }

                if (nearest !== 0) {
                    resultElement.innerHTML = `<strong>${n}</strong> is not a Perfect Number.<br>` +
                        `Nearest Perfect Number less than ${n} is <strong>${nearest}</strong>.`;
                } else {
                    resultElement.innerHTML = `<strong>${n}</strong> is not a Perfect Number.<br>` +
                        `No smaller Perfect Number exists.`;
                }
            }
        }
    </script>

</body>
</html>
